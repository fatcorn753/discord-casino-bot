# ゲーム演出の変更品（スキン）の見た目定義
slot_of_game:
  チンチロ: skin_dice
  パチンコ: skin_table
  ブラックジャック: skin_table

skins:
  - item_id: skin_kuro
    games: ["チンチロ"]
    title_prefix: "🕴️ "
    start_line: "黒服が、静かに立ち会っている…"
    win_line: "黒服「…お見事です」"
    lose_line: "黒服「…残念でしたな」"
    dice_mark: "⚫"
    role_win:
      pinzoro: "黒服「ピンゾロ…。5倍、お支払いします」 場が凍りつく…"
      arashi: "黒服「嵐…。3倍です」 ざわ…ざわ…"
      shigoro: "黒服「シゴロ。2倍です」 流れが来ている…"
    role_lose:
      pinzoro: "黒服「親のピンゾロ。5倍のお支払いを」 血の気が引いていく…"
      arashi: "黒服「親の嵐。3倍です」 地下に悲鳴が響く…"
      hifumi: "黒服「ヒフミ。倍のお支払いを」 地獄だ…"
    roll_speaker: "黒服"

  - item_id: skin_gold_dice
    games: ["チンチロ"]
    title_prefix: "✨ "
    start_line: "黄金の賽が、丼の中で鈍く光る…"
    win_line: "✨ 黄金の賽が、まばゆく輝いた！"
    lose_line: "黄金の賽は、冷たく転がった…"
    dice_mark: "🟡"
    role_win:
      pinzoro: "✨ 黄金のピンゾロ…ッ！！ 5倍…！ 賽が燃えるように輝く…！"
      arashi: "✨ 黄金の嵐…ッ！ 3倍…！ 光が丼からあふれる…"
      shigoro: "✨ 黄金のシゴロ…！ 2倍…。賽が笑っている…"
    role_lose:
      pinzoro: "親の黄金の賽がピンゾロ…！ 5倍払い…。金色の絶望…"

  - item_id: skin_glass_dice
    games: ["チンチロ"]
    title_prefix: "🩸 "
    start_line: "赤い爪が、ガラスの賽をそっとつまむ…"
    win_line: "🩸 ガラスの賽が、高く澄んだ音で鳴いた…"
    lose_line: "ガラスの賽に、ひびが入った…"
    dice_mark: "🔴"
    role_win:
      pinzoro: "🩸 ガラスの賽が、ピンゾロで砕け散った…ッ！ 5倍…！"
      arashi: "🩸 嵐の音が、ガラスを震わせる…！ 3倍…！"
      shigoro: "🩸 シゴロ…。赤い爪が、静かに笑う… 2倍…"
    role_lose:
      pinzoro: "🩸 親のピンゾロ…。ガラスが血に染まる… 5倍払い…"
    roll_mark: "🩸"

  - item_id: skin_vip
    games: ["パチンコ", "ブラックジャック"]
    title_prefix: "🥀 "
    start_line: "黒薔薇のシートに、深く腰を沈める…"
    win_line: "🥀 黒薔薇が、静かに祝福している…"
    lose_line: "🥀 黒薔薇の花びらが、一枚散った…"
    banner: "# 🥀 黒薔薇の祝福 🥀"

  - item_id: skin_numa
    games: ["パチンコ"]
    title_prefix: "🕳️ "
    start_line: "…第3クギを、玉が抜けていく…"
    win_line: "🕳️ 沼が、ついに口を開けた！！"
    lose_line: "🕳️ 沼は、すべてを飲み込んだ…"
    banner: "# 🕳️ 沼が開いた…！！ 🕳️"

# 季節演出: 期間中だけ、変更品を装備していない人の見た目になる（装備している人は、装備が優先）。
# start はその時刻を含み、end は含まない（タイムゾーンをつける）。配当・確率は変えない
seasons:
  - id: christmas_2026
    name: クリスマス
    start: "2026-11-21T00:00:00+09:00"
    end: "2026-12-26T00:00:00+09:00"
    daily_title: "🎁 サンタからのプレゼント"
    daily_line: "🎅 枕元に、サンタからプレゼントが届いたみたいだ…！"
    house_horse_icon: "🦌"  # 競馬: 帝愛の馬が、トナカイの見た目で走る
    skins:
      - item_id: season_xmas_dice
        games: ["チンチロ"]
        title_prefix: "🎄 "
        start_line: "🎅 サンタ帽の黒服が、丼を差し出す… 「メリークリスマス」"
        win_line: "🎁 サンタ帽の黒服「…今夜のプレゼントです」"
        lose_line: "🎅 サンタ帽の黒服「…悪い子には、石炭を」"
        dice_mark: "❄️"
        role_win:
          pinzoro: "🎄 聖夜のピンゾロ…ッ！！ 5倍…！ 鈴の音が鳴り響く…！"
          arashi: "❄️ 吹雪の嵐…ッ！ 3倍…！ 丼に雪が舞う…"
          shigoro: "🔔 シゴロ…！ 2倍…。ジングルベルが聞こえる…"
        role_lose:
          pinzoro: "親のピンゾロ…。5倍払い…。サンタは来なかった…"
          arashi: "親の嵐…。3倍払い…。プレゼントが吹雪に消えた…"
          hifumi: "ヒフミ…。倍払い…。靴下の中には、請求書が…"
        roll_mark: "🔔"

      - item_id: season_xmas_pachinko
        games: ["パチンコ"]
        title_prefix: "🎄 "
        start_line: "🔔 ジングルベルが流れる台に、玉を弾く…"
        win_line: "🎁 台から、プレゼントがあふれ出した！"
        lose_line: "❄️ 玉は、雪のように溶けていった…"
        banner: "# 🎅 サンタが来た…！！ 🎁"

      - item_id: season_xmas_blackjack
        games: ["ブラックジャック"]
        title_prefix: "🎄 "
        start_line: "🎅 サンタ帽のディーラーが、カードを配る…"
        win_line: "🎁 ディーラー「メリークリスマス。プレゼントです」"
        lose_line: "🎅 ディーラー「…今年は、いい子にしていましたか？」"

      - item_id: season_xmas_slot
        games: ["スロット"]
        title_prefix: "🎄 "
        start_line: "🔔 リールに雪の結晶が回る…"
        win_line: "🎁 リールから、プレゼントが転がり出た！"
        lose_line: "❄️ リールに、雪だけが積もった…"

      - item_id: season_xmas_roulette
        games: ["ルーレット"]
        title_prefix: "🎄 "
        start_line: "🔔 ツリーの飾りのような玉が、盤を回る…"
        win_line: "🎁 玉が、プレゼントの上で止まった！"
        lose_line: "❄️ 玉は、冷たい雪の上に落ちた…"
