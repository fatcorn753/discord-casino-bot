# 帝愛ファイナンス・破産・海外逃亡・銀行・CDS・身分の定数
seed: 3000
labor_skim_rate: 0.03
horse_prize_skim_rate: 0.0
skim_rate: 0.20
repay_rate: 0.30
bankrupt_floor: 10000
blacklist_days: 7

escape_chance: 0.01
escape_min_debt: 5000
escape_fine_rate: 0.10
escape_fine_min: 1000
escape_max_tries: 2
escape_cooldown_hours: 24

auction_start: 0.90
auction_step: 0.10
auction_floor: 0.70

# 帝愛の出品（#72）。差し押さえ品とは別に、帝愛が1日に何回か、期間限定でショップの品を出す。
# 売上は差し押さえ品の競売と同じく帝愛銀行の収入になる。品物そのものは新しく作られる（ペリカは増えない）
market_slots_per_day: 3            # 1日（UTC）に出す回数。時刻はランダム
market_auction_prob: 0.5           # 競売（時間とともに値下がり）にする確率。残りは定価販売
market_auction_rate: [0.5, 1.2]    # 競売の最初の値段（定価に対して）
market_auction_hours: [2, 6]       # 競売の期間（時間）
market_auction_end: 0.6            # 競売の終わりの値段（最初の値段に対して）。期間中に一定の速さで下がる
market_fixed_rate: [0.7, 1.5]      # 定価販売の値段（定価に対して）
market_fixed_hours: 6              # 定価販売の期間（時間）
market_fixed_qty: [2, 4]           # 定価販売の数（消耗品のとき。見た目の品は1つ）
market_black_prob: 0.2             # 闇市品（中身が未鑑定）になる確率
market_black_worse: 0.07           # 闇市品の中身が、もっと安い品だった確率
market_black_better: 0.03          # 闇市品の中身が、もっと高い品だった確率（残りは表示どおり）
seize_rate: 0.50

debt_rate_per_day: 0.01
debt_interest_max_days: 10
grace_debt: 15000
grace_hours: 24

bank_min_deposit: 100
reserve_ratio: 0.20
loan_recovery_per_hour: 0.02
lock_debt_rate: 0.05
loss_share: 0.03
# 帝愛信託（#33）の利息: r_trust = 無リスク金利 r_f + trust_premium_per_day（1日あたり。連続複利）
trust_premium_per_day: 0.001
# 無リスク金利 r_f（#18）: 帝愛銀行の準備率 θ に連動して動く（CIR 風: dr = κ(μ(θ) − r)dt + σ√r dW、毎分）
# 目標 μ(θ) = 下限 + (上限 − 下限) × exp(−α θ)。下限・上限は「通常債の満期まで（72時間）の利息 ％」で書く
# α は、平時の θ ≈ 0.225 で通常債が 4% になる値
rf_min_pct: 1.5
rf_max_pct: 8.0
rf_alpha: 4.25
rf_kappa_per_day: 2.0     # 平均回帰の速さ（1日あたり。半減期 約8時間）
rf_sigma: 0.02            # 揺らぎの大きさ（√r に掛ける。1日あたり）
run_warn_ratio: 0.15
run_danger_ratio: 0.05

cds_min_stake: 100
cds_min_odds: 1.2
cds_max_odds: 15.0
cds_term_days: 14
cds_self_cap: 50000
cds_payout_cap_rate: 0.50

wealthy_assets: 1000000

# 最前線サーモスタット（#32）。銀行に出入りするペリカを、金庫の手前で受け止める器
thermostat:
  enforce: false         # false の間は観測だけ（現金には手を付けず、消える額・肩代わりの額を記録する）
  cool_days: 7           # 短期熱量 L が 1/10 に冷めるまでの日数
  memory_ratio: 4        # 長期キャパシティ E は、L の何倍ゆっくり縮むか（7日 × 4 = 28日）
  capacity_min: 20000    # E の下限（流入がまったく無くても残る器）
  coupling: 1.0          # c。|L| が器を塞ぐ強さ（1.0 未満にすると、損失が続いたとき器が詰まりうる）

# 帝愛共済（#34）。多層資本の最下層。平時は銀行の余剰から配当を受け、信託でも払えない超過損失を口数に応じて負う
kyosai:
  target_ratio: 0.30      # 準備率がこれを超えた分の現金を「余剰」とする（配当の原資）
  dividend_share: 0.05    # 1日に配る、余剰の割合
  dividend_cap: 50000     # 1日の配当の上限（サーバーごと）
  gate_ratio: 0.20        # 準備率がこれ未満、または破産猶予中の人がいる間は、口の売買を止める
  dormant_days: 30        # この日数、口座が動いていない人の口は、帝愛が回収する
  auction_start: 10000    # 帝愛が持つ口を売るときの、1口の値段（回収した日から始まる）
  auction_decay: 0.10     # 1日ごとに、始値のこの割合だけ下がる
  auction_floor: 3000     # 値段の下限
  offer_hours: 24         # 口の譲渡の申し出が、受けられる時間
  motion_hours: 24        # 動議（信託の上乗せ金利の変更）の投票期間
  premium_max: 0.005      # 動議で決められる上乗せ金利の上限（1日あたり）

statuses:
  katagi:
    label: "🟢 カタギ"
  underground:
    label: "🟤 地下労働者"
    mark: "🟤"
    name: "地下労働者"
  bankrupt:
    label: "🔴 破産者"
    mark: "🔴"
    name: "破産者"
  wealthy:
    label: "🟡 富豪"
    mark: "🟡"
    name: "富豪"
