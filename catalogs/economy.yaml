# 経済共通・送金・貸付・クイズ報酬・抽選・週間ランキング・プレイヤー間取引の定数
wallet:
  initial_balance: 3000
  daily_base: 1000
  daily_streak_bonus: 100
  daily_streak_cap: 20
  daily_slot_hours: 6
  max_notices: 5
  consumable_effects:
    daily_double: daily_boost
    insurance: insurance
  medals:
    1: "🥇"
    2: "🥈"
    3: "🥉"
  part_labels:
    cash: "💴 現金（借金を引く）"
    deposit: "🏦 帝愛への預金"
    crypto: "📈 株・CS（現物と証拠金）"
    bonds: "📜 債券"
    options: "🎯 オプション"
    items: "🎁 持ち物（買値）"
    relics: "🏺 発掘品（目安の価値）"
    horses: "🐎 競走馬（購入価格＋引退金の見込み）"
    pot: "⛏ 受け取る前の地下作業の稼ぎ"
    tools: "🧰 地下作業の工具・寮（これまでの強化費用）"
    escrow: "🔒 競りへの入札（預かり中）"
    loans: "🤝 貸し借り（貸した分−借りた分）"
  grace_lock_text: "破産猶予中は、取引（出品・買う・入札）ができません（破産の前に、資産を移して、借金を踏み倒すのを防ぐためです）。"

transfer:
  fee_rate: 0.10
  daily_limit: 20000
  confirm_from: 5000
  min_games: 3
  board_interval_minutes: 1

loans:
  user_min_principal: 100
  min_term_days: 1
  max_term_days: 30
  offer_hours: 24
  max_borrower_open: 1
  max_lender_open: 5
  max_lender_active: 10
  remind_hours: 24
  late_min_rate_tenths: 20
  late_cap: 2

quizpay:
  user_min_minutes: 1
  user_max_minutes: 10080
  user_default_minutes: 4320
  min_participants: 2
  min_games_for_reward: 3
  open_limit: 2
  daily_limit: 3
  base_reward: 100
  max_bonus: 200
  target_rate: 0.40
  reward_scale_base: 100
  participation_rate: 1.0
  max_questions: 30
  max_question_len: 500
  max_choice_len: 80
  max_explanation_len: 800
  max_verdict_len: 20
  max_minutes: 525600
  default_reward: 100
  default_right: "正解！"
  default_wrong: "不正解…"
  letters: "ABCD"

raffle:
  min_fee: 500
  random_fee_range: [500, 3000]
  default_minutes: 60
  max_minutes: 1440
  shown_entrants: 20

weekly:
  min_plays: 5
  announce_top: 5
  check_minutes: 5

p2p:
  fee_rate: 0.05
  max_active: 5
  fixed_days: 7
  auction_hours: [1, 6, 24, 72]
  min_increment_rate: 0.05
  min_increment: 100
  snipe_seconds: 300
  pair_daily_limit: 100000
  min_price: 100
  item_price_range: [0.10, 5.0]
  horse_price_range: [3000, 300000]
  escrow_owner: -3
  confirm_from: 10000
  tradable_kinds:
    - consumable
    - racing
    - card_color
    - card_icon
    - skin_dice
    - skin_table
    - color_role
  slot_of_kind:
    card_color: card_color
    card_icon: card_icon
    skin_dice: skin_dice
    skin_table: skin_table
  ended_text:
    sold:
      title: "✅ 売れました"
      body: "{label} は、<@{buyer}> が **{price}** で買いました。"
    expired:
      title: "⏳ 終了（売れ残り）"
      body: "{label} は、買い手がつかず、終了しました。"
    cancelled:
      title: "🚫 取り消されました"
      body: "{label} の出品は、取り消されました。"
