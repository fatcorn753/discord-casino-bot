[project]
name = "discord-casino-bot"
version = "0.1.0"
description = "A Discord casino bot with Pelica currency system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "PIE"]
ignore = ["E501", "UP045"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["domain", "services", "infra", "cogs", "tests", "main.py", "manage.py"]
pythonVersion = "3.11"
executionEnvironments = [
  { root = "tests", extraPaths = ["."] },
]

